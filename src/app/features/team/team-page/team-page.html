<section class="page-header">
  <p class="page-header__label">Team</p>
  <h1 class="page-header__title">The people building <span class="accent-text">tSoNova</span>.</h1>
  <p class="page-header__subtitle">
    A small team working across AI, microchip design, and everyday utilities.
  </p>
  <p class="page-header__note">Each year, we invest in one university student project.</p>
</section>

<section class="team">
  <div class="team__grid">
    @for (member of members; track member.linkedin) {
      <a class="team__card" [href]="member.linkedin" target="_blank" rel="noopener noreferrer">
        <span class="team__avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" />
            <path d="M4.5 20c1.6-3.6 4.6-5.5 7.5-5.5s5.9 1.9 7.5 5.5" stroke-linecap="round" />
          </svg>
        </span>
        <span class="team__name">{{ member.name }}</span>
        <span class="team__link">LinkedIn ↗</span>
      </a>
    }
  </div>
</section>
